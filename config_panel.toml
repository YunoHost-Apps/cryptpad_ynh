version = "1.0"

[main]
name = "Main Settings"
services = ["__APP__"]

    [main.admin]
    name = "Administration"

        [main.admin.admin_keys]
        ask = "List of admins users keys"
        type = "tags"
        # Note we don't allow the chars [, ], " in username to avoid any issue in the config file. But technically it's possible to create a user in cryptpad with theses chars.
        # But we don't expect that it's common to have theses char in the username for admins.
        # For the domain part we are based on https://github.com/YunoHost/yunohost/blob/18ac16a5c71ef6af1d1c274a70bbaee7b42cecfe/share/actionsmap.yml#L102
        # but with some simplifications otherwise a validation of invalid regex can end with an exponential processing of the regex
        # For the key part we are based on this regex https://github.com/cryptpad/cryptpad/blob/9808cf25c1091d6cf532df13bf5a70ba332f8d4d/src/common/common-signing-keys.js#L25
        pattern.regexp = '^\[[^"\[\]]+@([^\W_A-Z]|-|\.)+((xn--)?[^\W_]{2,})/[-a-zA-Z0-9+=]{44}\](,\[[^"\[\]]+@([^\W_A-Z]|-|\.)+((xn--)?[^\W_]{2,})/[-a-zA-Z0-9+=]{44}\])+$'
        pattern.error = 'The admin key need to be in format "[user@domain/pubkey]"'
        help = "This specify the users which will have access to the crypt administration. This list is a list of keys. You can get the user key in user Menu (avatar at the top right) > Settings > Account > Public Signing Key. So for instance it should be something like this: [cryptpad-user1@my.awesome.website/YZgXQxKR0Rcb6r6CmxHPdAGLVludrAF2lEnkbx1vVOo=]"
